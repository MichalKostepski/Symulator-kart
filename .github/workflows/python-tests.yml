name: Python tests

on:
  push:
    branches: [MAIN_NEW]
  pull_request:
    branches: [MAIN_NEW]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile Python source files
        run: python -m compileall -q app scripts tests
      - name: Run unit, white-box and black-box tests
        run: python scripts/run_all_tests.py

  gui-smoke:
    name: Ubuntu / Tkinter GUI tests (Xvfb)
    runs-on: ubuntu-latest
    permissions:
      contents: write
    timeout-minutes: 8
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Xvfb and Tk libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb python3-tk
      - name: Install screenshot helper (CI only; not an app dependency)
        run: python -m pip install --disable-pip-version-check pillow
      - name: Smoke-test actual Tkinter windows and capture GUI
        run: timeout 120s xvfb-run -a -s "-screen 0 1920x1080x24" python scripts/gui_smoke.py --screenshots gui-screenshots
      - name: Upload real GUI screenshots for review
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tkinter-gui-screenshots
          path: gui-screenshots/*.png
          if-no-files-found: warn
          retention-days: 30
      - name: Publish reproducible GUI preview images to README
        if: github.event_name == 'push' && github.ref == 'refs/heads/MAIN_NEW' && success()
        shell: bash
        run: |
          mkdir -p docs/screenshots
          cp gui-screenshots/host-window.png gui-screenshots/client-window.png docs/screenshots/
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add docs/screenshots/host-window.png docs/screenshots/client-window.png
          if ! git diff --cached --quiet; then
            git commit -m "docs: publish authentic Tkinter GUI smoke screenshots [skip ci]"
            git push origin HEAD:MAIN_NEW
          fi
