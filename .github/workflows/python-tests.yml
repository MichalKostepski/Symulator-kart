name: Python tests

on:
  push:
    branches: [MAIN_NEW]
  pull_request:
    branches: [MAIN_NEW]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
        python-version: ["3.11", "3.12"]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Compile Python source files
        run: python -m compileall -q app scripts tests
      - name: Run unit, white-box and black-box tests
        run: python scripts/run_all_tests.py

  gui-smoke:
    name: Ubuntu / Tkinter GUI tests (Xvfb)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    env:
      PYTHONDONTWRITEBYTECODE: "1"
      PYTHONIOENCODING: utf-8
    steps:
      - name: Check out repository
        uses: actions/checkout@v5
      - name: Install Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.12"
      - name: Install Xvfb and Tk libraries
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb python3-tk
      - name: Run existing Tkinter host/client tests on a virtual desktop
        run: xvfb-run -a python -m unittest tests/unit/client_test.py tests/unit/host_test.py -v
